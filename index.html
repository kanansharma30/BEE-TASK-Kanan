<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Simple Shop</h1>
    <button id="cart-toggle-btn">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <section class="products-section">
      <h2>Products</h2>

      <div class="controls">
        <label>
          Category:
          <select id="category-filter">
            <option value="All">All</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Books">Books</option>
          </select>
        </label>

        <label>
          Sort by price:
          <select id="price-sort">
            <option value="none">Default</option>
            <option value="low-high">Low to High</option>
            <option value="high-low">High to Low</option>
          </select>
        </label>
      </div>

      <div id="product-list" class="product-list"></div>
    </section>

    <aside id="cart-panel" class="cart-section">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button id="close-cart-btn">Close</button>
      </div>

      <div id="cart-items"></div>

      <div class="coupon">
        <input type="text" id="coupon-input" placeholder="Enter coupon code">
        <button id="apply-coupon-btn">Apply Coupon</button>
      </div>
      <p id="coupon-message" class="message"></p>

      <div class="checkout">
        <h2>Checkout</h2>
        <p>Subtotal: <span id="subtotal">₹0.00</span></p>
        <p>Discount: <span id="discount">-₹0.00</span></p>
        <p class="final-total">Total: <span id="total">₹0.00</span></p>
        <button id="place-order-btn">Place Order</button>
        <p id="order-message" class="message"></p>
      </div>
    </aside>
  </main>

  <div id="overlay"></div>

  <script src="script.js"></script>
</body>
</html>
